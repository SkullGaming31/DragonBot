name: CI

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Run linter (if available)
        run: npm run lint --if-present

  test:
    name: Tests
    # Run inside a Docker container that includes OpenSSL 1.1 (Debian Bullseye image)
    runs-on: ubuntu-latest
    container:
      image: node:24-bullseye
    needs: lint
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node modules cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (if available)
        run: npm run typecheck --if-present

      - name: lint (if available)
        run: npm run lint --if-present

      - name: Run tests (vitest)
        run: |
          # Use fewer workers to be gentle on CI runners and reduce memory pressure
          npx vitest --run --reporter=dot --reporter=junit --outputFile.junit=vitest-junit.xml --maxWorkers=2 --coverage

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-junit
          path: vitest-junit.xml

# Database tests use isolated mongodb-memory-server replica sets.
